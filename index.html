<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12151f" />
    <meta name="description" content="Personagens, builds e equipes de Genshin Impact" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Genshin World" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var l = localStorage.getItem('genshinworld:lang')
        if (!l) l = (navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en'
        document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en'
        if (l === 'en')
          document
            .querySelector('meta[name="description"]')
            .setAttribute('content', 'Characters, builds and teams for Genshin Impact')
      } catch (e) {}
      try {
        var t = localStorage.getItem('genshinworld:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
    <title>Genshin World</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
